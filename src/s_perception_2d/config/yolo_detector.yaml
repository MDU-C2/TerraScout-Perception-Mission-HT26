
/**:
  ros__parameters:
    # Model configuration
    model_path: ""
    device: "auto"
    inference_imgsz: 640

    # Detection thresholds & processing rate
    confidence_threshold: 0.35
    max_aspect_ratio_h_w: 1.5
    iou_threshold: 0.45
    target_fps: 5.0

    input_image_topic: "oakd/rgb/image_raw"
    output_detections_topic: "oakd/detections_2d"
    publish_annotated_image: true
    annotated_image_topic: "oakd/detections_image"
    qos_reliability: "best_effort"

    configured_classes:
      - "Apache friendly"
      - "Ka-52 Enemy"
    allow_unknown_records: true           

    # Logging
    enable_file_logging: true
    log_dir: "/run/sage/log/perception"
