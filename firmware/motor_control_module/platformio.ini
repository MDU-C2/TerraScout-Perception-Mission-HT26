; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c6-devkitm-1]
platform = espressif32 @ 7.1.0
board = esp32-c6-devkitm-1
framework = espidf

[env:rc-monitor]
extends = env:esp32-c6-devkitm-1
board_build.cmake_extra_args = -DRC_MONITOR_BUILD=ON
monitor_speed = 115200

[env:bms-monitor]
extends = env:esp32-c6-devkitm-1
; The new esp_twai driver is unavailable in ESP-IDF 5.4.
platform = espressif32 @ 7.1.0
board_build.cmake_extra_args = -DBMS_MONITOR_BUILD=ON
monitor_speed = 115200
build_flags =
    -DBMS_MONITOR_TX_PIN=5
    -DBMS_MONITOR_RX_PIN=4
